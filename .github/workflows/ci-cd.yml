name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

env:
  DOTNET_VERSION: '9.0.x'
  
jobs:
  # ========== JOB 1: BUILD & TEST ==========
  build-and-test:
    name: Build & Test
    runs-on: windows-latest  # ← MAUI precisa Windows
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Install MAUI Workloads
        run: dotnet workload restore
        shell: pwsh
          
      - name: Restore dependencies
        run: dotnet restore MindCarePlus.sln
        shell: pwsh
        
      - name: Build solution
        run: dotnet build MindCarePlus.sln --configuration Release --no-restore
        shell: pwsh
        
      # Testes unitários (só backend, sem mobile)
      - name: Run backend tests
        run: dotnet test MindCarePlus.sln --configuration Release --no-build --filter "FullyQualifiedName!~Mobile" --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true
        shell: pwsh
        
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always()
        with:
          files: '**/test-results.trx'
          
  # ========== JOB 2: CODE QUALITY ==========
  code-quality:
    name: Code Quality
    runs-on: windows-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Install MAUI Workloads
        run: dotnet workload restore
        shell: pwsh
          
      - name: Restore dependencies
        run: dotnet restore MindCarePlus.sln
        shell: pwsh
        
      - name: Run code analysis
        run: dotnet build MindCarePlus.sln --configuration Release /p:TreatWarningsAsErrors=false
        shell: pwsh
        
  # ========== JOB 3: SECURITY SCAN ==========
  security-scan:
    name: Security Scan
    runs-on: windows-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Run security scan
        run: |
          dotnet list MindCarePlus.sln package --vulnerable --include-transitive 2>&1 | Tee-Object -FilePath security-scan.txt
          if (Select-String -Path security-scan.txt -Pattern "has the following vulnerable packages") {
            Write-Host "Vulnerabilidades encontradas!"
            exit 1
          }
        shell: pwsh
          
  # ========== JOB 4: PR VALIDATION ==========
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build-and-test, code-quality, security-scan]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: All checks passed
        run: |
          echo "Todos os checks passaram!"
          echo "Build: OK"
          echo "Tests: OK"
          echo "Code Quality: OK"
          echo "Security: OK"
          echo ""
          echo "Este PR está pronto para merge!"

  # ========== JOB 5: JIRA - MOVE TO IN REVIEW ==========
  jira-in-review:
    name: Jira → In Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    needs: [build-and-test, code-quality, security-scan]
    
    steps:
      - name: Extract Jira Issue Key
        id: extract
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          ISSUE_KEY=$(echo "$BRANCH_NAME" | grep -oP 'KAN-\d+' | head -1)
          
          if [ -z "$ISSUE_KEY" ]; then
            echo "Nenhum ticket Jira encontrado na branch: $BRANCH_NAME"
            echo "Use o formato: feature/KAN-XX-descricao"
            echo "issue_key=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "Ticket encontrado: $ISSUE_KEY"
          
      - name: Transition to In Review
        if: steps.extract.outputs.issue_key != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract.outputs.issue_key }}
          transition: "In Review"
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          
      - name: Comment on PR
        if: steps.extract.outputs.issue_key != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueKey = '${{ steps.extract.outputs.issue_key }}';
            const jiraUrl = '${{ secrets.JIRA_BASE_URL }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Jira Update**\n\n` +
                    `Ticket [${issueKey}](${jiraUrl}/browse/${issueKey}) movido para **In Review**\n\n` +
                    `### Todos os checks passaram:\n` +
                    `- Build & Tests\n` +
                    `- Code Quality\n` +
                    `- Security Scan\n\n` +
                    `Este PR está pronto para revisão!`
            });

  # ========== JOB 6: JIRA - MOVE TO IN DEPLOYMENT ==========
  jira-deployment:
    name: Jira → In Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, code-quality, security-scan]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          
      - name: Extract Jira Issue Key
        id: extract
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          ISSUE_KEY=$(echo "$COMMIT_MSG" | grep -oP 'KAN-\d+' | head -1)
          
          if [ -z "$ISSUE_KEY" ]; then
            MERGED_BRANCH=$(echo "$COMMIT_MSG" | grep -oP "from\s+\K[^\s]+" || echo "")
            echo "Branch mergeada: $MERGED_BRANCH"
            
            if [ -n "$MERGED_BRANCH" ]; then
              ISSUE_KEY=$(echo "$MERGED_BRANCH" | grep -oP 'KAN-\d+' | head -1)
            fi
          fi
          
          if [ -z "$ISSUE_KEY" ]; then
            echo "Nenhum ticket Jira encontrado no merge"
            echo "Commit message analisado: $COMMIT_MSG"
            echo "issue_key=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "Ticket encontrado: $ISSUE_KEY"
          
      - name: Transition to In Deployment
        if: steps.extract.outputs.issue_key != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract.outputs.issue_key }}
          transition: "In Deployment"
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          
      - name: Success notification
        if: steps.extract.outputs.issue_key != ''
        run: |
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL!"
          echo "=========================================="
          echo "Ticket: ${{ steps.extract.outputs.issue_key }}"
          echo "Status: In Deployment"
          echo "Branch: main"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================="